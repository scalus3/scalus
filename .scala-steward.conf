# Do not propose a version until it has been visible for two weeks. Security
# fixes are applied by hand when they matter.
updates.cooldown = {
  minimumAge = "14 days"
}

updates.pin = [
  # The sbt plugin (scalusSbtPlugin) must stay on Scala 2.12 because sbt 1.x
  # plugins run on the sbt 2.12 runtime. Pin scala-library to the 2.12 series so
  # Scala Steward does not try to bump it to 2.13.x.
  { groupId = "org.scala-lang", artifactId = "scala-library", version = "2.12." },
  # The default Scala is the 3.3 LTS. The 3.9.x cross axis and the sbt 2 plugin's
  # 3.8.x are chosen by hand (see scala3NextLtsVersion and scalusSbtPlugin in
  # build.sbt), so only LTS patch releases are routine updates.
  { groupId = "org.scala-lang", version = "3.3." },
  # sbt 2 is a migration, not an update.
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]

updates.ignore = [
  # cardano-client-lib publishes 0.x.0-preN builds; wait for the final release.
  { groupId = "com.bloxbean.cardano", version = { contains = "-pre" } }
]
