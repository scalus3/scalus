org.slf4j.simpleLogger.defaultLogLevel=debug
org.slf4j.simpleLogger.log.com.bloxbean=off
org.slf4j.simpleLogger.log.scalus=off
# the native-library loader of scalus-crypto-jni logs at DEBUG; its lines reach stderr in every
