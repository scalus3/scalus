name: Release
on:
  push:
    branches: [ master ]
    # Scalus version tags only. GitHub ignores path filters on tag pushes, so "*" also ran this
    # release for secp256k1-jni-v* tags (Dec 2025) and would for crypto-jni-v* tags.
    tags: [ "v[0-9]*" ]
    paths-ignore:
      - 'scalus-secp256k1-jni/**'
      - 'scalus-crypto-jni/**'
      - '.github/workflows/**'
      - '*.md'
      - 'docs/**'
      - 'scalus-site/**'
  workflow_dispatch: # Manual trigger as fallback
jobs:
  publish:
    runs-on: ubuntu-22.04
    # Snapshot publishes take ~10 min, but a tag release signs and stages every artifact
    # for Sonatype and needs well over 40 (the v1.0.0-M1 first attempt timed out at 40).
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - run: nix develop .#ci --command bash -c "sbt ci-release"
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
