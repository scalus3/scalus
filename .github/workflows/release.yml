name: Release
on:
  push:
    branches: [ master ]
    # Scalus version tags only. GitHub ignores path filters on tag pushes, so "*" also ran this
    # release for secp256k1-jni-v* tags (Dec 2025) and would for crypto-jni-v* tags.
    tags: [ "v[0-9]*" ]
    paths-ignore:
      - 'scalus-secp256k1-jni/**'
      - 'scalus-crypto-jni/**'
      - '.github/workflows/**'
      - '*.md'
      - 'docs/**'
      - 'scalus-site/**'
  workflow_dispatch: # Manual trigger as fallback
jobs:
  publish:
    runs-on: ubuntu-22.04
    # Snapshot publishes take ~10 min, but a tag release signs and stages every artifact
    # for Sonatype and needs well over 40 (the v1.0.0-M1 first attempt timed out at 40).
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      # Restore only: the CI-JVM 3.3.9 job saves the Nix store of the `ci` shell, and each push job
      # its dependency cache ([ci.nix.one-saver], [ci.deps.*]). This job takes the ci-jvm-3.3.9 entry.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-ci.${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-ci.
      - name: Restore the dependency cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt/boot
          key: deps-${{ runner.os }}-${{ runner.arch }}-ci-jvm-3.3.9-
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-ci-jvm-3.3.9-
      # A published artifact must carry the exact git version in BuildInfo.version: projects that
      # use a snapshot read it to pin the Scalus compiler. SCALUS_STABLE_VERSION replaces it with
      # a fixed one, for push CI only ([ci.alias.release-guard]).
      - name: Check that the release uses the git version
        run: |
          if [[ -n "${SCALUS_STABLE_VERSION:-}" ]]; then
            echo "::error::SCALUS_STABLE_VERSION is set, so the artifacts would not carry the git version"
            exit 1
          fi
      # A published artifact comes from a clean build ([ci.alias.release-clean]). This job restores
      # no task cache, and `clean` makes sbt ignore the global disk cache for the next command.
      - run: nix develop .#ci --accept-flake-config --command bash -c 'sbt "clean; ci-release"'
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
