name: CI-Native
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'scalus-secp256k1-jni/**'
      - 'scalus-crypto-jni/**'
      - '.github/workflows/**'
env:
  # Only master saves caches; a branch restores the entries of master. The work branch of the CI
  # speed design saves too, until that work lands (docs/superpowers/specs/2026-11-21-ci-speed-design.md, 6.5).
  SAVE_CACHES: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/ci-quality-assurance-e40b7b' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      # The deletion of old cache entries ([ci.prune.after-save]).
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      # The Nix store of the `ci` shell. The CI-JVM 3.3.9 job saves it ([ci.nix.one-saver]).
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-ci-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-ci-
      # The coursier downloads and the sbt 2 launcher, one entry per job ([ci.deps.*]); see ci-jvm.yml.
      - name: Name the dependency cache
        id: deps
        run: |
          prefix="deps-${{ runner.os }}-${{ runner.arch }}-ci-native-$(date -u +%Y-%m)-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties') }}" >> "$GITHUB_OUTPUT"
          mkdir -p ~/.cache/coursier ~/.sbt/boot
      - name: Restore the dependency cache
        id: deps-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt/boot
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.prefix }}
      - name: Build and test in Nix devshell
        # The native test binaries each carry their own GC heap and run alongside the sbt JVM.
        # The shared `ci` devshell sets -Xmx7g (sized for JVM/JS tests); that leaves too little
        # headroom for the native binaries. Drop the sbt heap to 5G for this job only (the Scala
        # Native build/optimize still fits). Substitution runs inside the nix shell where
        # SBT_OPTS/JAVA_OPTS are defined, so the arg is single-quoted.
        # `free -h`/`nproc` log the runner's real memory/cores while we tune native test memory.
        run: |
          echo "== runner resources =="; free -h; nproc; echo "======================"
          nix develop .#ci --accept-flake-config --command bash -c 'export SBT_OPTS="${SBT_OPTS//-Xmx7g/-Xmx5g}" JAVA_OPTS="${JAVA_OPTS//-Xmx7g/-Xmx5g}"; sbt ci-native'
      - name: Save the dependency cache
        if: env.SAVE_CACHES == 'true' && steps.deps-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt/boot
          key: ${{ steps.deps.outputs.key }}
      - name: Delete the older dependency caches of this job
        if: env.SAVE_CACHES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/prune-caches.sh "${{ steps.deps.outputs.prefix }}" "${{ steps.deps.outputs.key }}"
      - name: Report test results
        uses: sarisia/actions-status-discord@v1
        if: failure()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "CI-Native ❌ - ${{ github.actor }} on ${{ github.ref_name }}"
          description: "[${{ github.event.head_commit.message }}](${{ github.event.head_commit.url }})"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          nodetail: true
          notimestamp: true