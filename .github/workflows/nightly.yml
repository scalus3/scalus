name: Nightly
# Tests that push CI leaves out: everything tagged scalus.testing.Benchmark (budget tables,
# optimizer impact reports, crypto benchmarks). `test` excludes the tag (excludeFromTest in
# build.sbt); `testOnly -- -n <tag>` selects only the tagged tests.
# Measured locally on 2026-10-21: 80 tests, 485 s wall including compilation.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 05 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      # Restore only: the CI-JVM 3.3.9 job saves the Nix store of the `ci` shell, and each push job
      # its dependency cache ([ci.nix.one-saver], [ci.deps.*]). This job takes the ci-jvm-3.3.9 entry.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-ci-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-ci-
      - name: Restore the dependency cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt/boot
          key: deps-${{ runner.os }}-${{ runner.arch }}-ci-jvm-3.3.9-
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-ci-jvm-3.3.9-
      - name: Run tagged tests in Nix devshell
        run: nix develop .#ci --accept-flake-config --command bash -c 'sbt "jvm/testOnly -- -n scalus.testing.Benchmark"'
      - name: Report test results
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Nightly ${{ job.status == 'success' && '✅' || '❌' }} - ${{ github.ref_name }}"
          description: "[${{ github.event_name }}] - (${{ github.sha }})"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          nodetail: true
          notimestamp: true
