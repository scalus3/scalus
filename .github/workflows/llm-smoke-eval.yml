name: LLM Smoke Eval
# Manual release-checklist item: verifies that an LLM agent with only the
# shipped context (AGENTS.md, skills, scalus.org artifacts) produces Scalus
# code that compiles and passes tests. Does not gate the release build.
on:
  workflow_dispatch:

jobs:
  smoke-eval:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout scalus
        uses: actions/checkout@v4
      - name: Checkout validator.g8 template
        uses: actions/checkout@v4
        with:
          repository: scalus3/validator.g8
          path: validator.g8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run smoke eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEMPLATE_DIR: ${{ github.workspace }}/validator.g8
        run: bash scripts/llm-smoke-eval.sh
