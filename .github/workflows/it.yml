name: Integration tests
on:
  workflow_dispatch:
  schedule:
    - cron: '00 07 * * *'
# Two jobs, so a flaky devnet does not hide a ledger divergence (sbt aliases it-conformance and
# it-network in build.sbt).
jobs:
  conformance:
    # Offline and deterministic: the cardano-ledger vectors, the it-data mainnet blocks and the
    # full Dugite LEDGER corpus. A failure here means Scalus no longer matches the ledger.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v7
      - name: Download it-data
        uses: robinraju/release-downloader@v1
        with:
          latest: true
          preRelease: true
          tag: 'it-data'
          fileName: 'it-data.zip'
          zipBall: true
          out-file-path: 'it-data'
          extract: true
      # The full Dugite LEDGER corpus (ledger-rules spec [CV-21]): a third-party release asset,
      # pinned by tag and by sha256
      - name: Cache Dugite ledger corpus
        uses: actions/cache@v4
        with:
          path: dugite/ledger-rules.tar.gz
          key: dugite-ledger-rules-018c480caad1abf311b7203998d0e905b743d17ee26213edc4575d027faab996
      - name: Download Dugite ledger corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=dugite/ledger-rules.tar.gz
          [ -f "$f" ] || gh release download conformance-corpus-v20261101-084724 \
            -R michaeljfazio/dugite -p ledger-rules.tar.gz -D dugite
          echo "018c480caad1abf311b7203998d0e905b743d17ee26213edc4575d027faab996  $f" | sha256sum -c
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - name: Run the conformance tests in the Nix devshell
        run: nix develop .#ci --accept-flake-config --command bash -c "export SCALUS_IT_DATA_PATH=$GITHUB_WORKSPACE/it-data/it-data; export SCALUS_DUGITE_LEDGER_RULES=$GITHUB_WORKSPACE/dugite/ledger-rules.tar.gz; sbt it-conformance"
      - name: Report test results
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Conformance ${{ job.status == 'success' && '✅' || '❌' }} - ${{ github.ref_name }}"
          description: "[${{ github.event_name }}] - (${{ github.sha }})"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          nodetail: true
          notimestamp: true

  integration:
    # Against a live network: Yaci DevKit in Docker, and Blockfrost (canceled without
    # BLOCKFROST_API_KEY).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v7
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - name: Run the integration tests in the Nix devshell
        run: nix develop .#ci --accept-flake-config --command bash -c "sbt it-network"
      - name: Report test results
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "IT ${{ job.status == 'success' && '✅' || '❌' }} - ${{ github.ref_name }}"
          description: "[${{ github.event_name }}] - (${{ github.sha }})"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          nodetail: true
          notimestamp: true
