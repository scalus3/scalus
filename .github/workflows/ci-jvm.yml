name: CI-JVM
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'scalus-secp256k1-jni/**'
      - 'scalus-crypto-jni/**'
      - '.github/workflows/**'
env:
  # Only master saves caches; a branch restores the entries of master
  # (docs/superpowers/specs/2026-11-21-ci-speed-design.md, [ci.nix.save-on-master]).
  SAVE_CACHES: ${{ github.ref == 'refs/heads/master' }}
  # A fixed version, so the git version in BuildInfo does not change the sources of each commit
  # ([ci.alias.stable-version]). This job publishes nothing.
  SCALUS_STABLE_VERSION: "1"
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Don't cancel the other Scala version's job when one fails.
      fail-fast: false
      matrix:
        include:
          # One job per supported compiler version. The first is the default LTS and the version
          # the `_3` library artifacts are published from, so it also carries the format + MiMa
          # checks.
          - { name: "3.3.9", task: ci-jvm-3_3_9 }
          - { name: "3.9.0", task: ci-jvm-3_9_0 }
          - { name: "3.10.1", task: ci-jvm-3_10_1 }
    permissions:
      contents: read
      id-token: write
      # The deletion of old cache entries ([ci.prune.after-save]).
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      # The Nix store of the `ci` shell, one entry per flake state ([ci.nix.*]). The 3.3.9 job saves
      # it; the other jobs and workflows only restore it, so no two jobs race on one key. Before the
      # save the action collects every path without a GC root (gc-max-store-size-linux: 0), so an
      # entry restored by prefix after a flake update leaves no old path in the new one. The purge
      # then deletes the older entries of this shell. Each key ends the shell name with `.`: the
      # cache API filters keys with SQL LIKE, so a prefix `...-ci_` also matched `...-ci-native_`
      # and `...-ci-lean_`, and this job purged those entries ([ci.nix.key-terminator]).
      - name: Restore the Nix store of the saving job
        id: nix-restore
        if: matrix.name == '3.3.9'
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-ci.${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-ci.
      - name: Restore the Nix store
        if: matrix.name != '3.3.9'
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-ci.${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-ci.
      # The GC root of the save above: the `ci` shell only. Not the flake inputs: `nix flake
      # archive` fetches all of them, haskell.nix and hackage included (4.3 GB, 3.3 min), where
      # the evaluation of `ci` needs only nixpkgs and the plutus source ([ci.nix.gc-roots]).
      - name: Keep the dev shell from garbage collection
        if: matrix.name == '3.3.9' && env.SAVE_CACHES == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/gcroots"
          nix develop .#ci --accept-flake-config --profile "$RUNNER_TEMP/gcroots/ci" --command true
          echo "closure of the ci shell: $(nix path-info -S "$RUNNER_TEMP/gcroots/ci" | awk '{printf "%.0f MB", $2/1048576}')"
          du -sh /nix/store
      # Saved here, before the build and the tests, so a failing test does not lose the store: the
      # post step of the combined action is skipped when the job fails. The garbage collection
      # keeps the rooted shell, which the next steps use.
      - name: Save the Nix store
        if: matrix.name == '3.3.9' && env.SAVE_CACHES == 'true' && steps.nix-restore.outputs.hit-primary-key != 'true'
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-ci.${{ hashFiles('flake.nix', 'flake.lock') }}
          gc-max-store-size-linux: 0
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-ci.
          purge-created: 0
          purge-primary-key: never
      # The coursier downloads and the sbt 2 launcher, one entry per job ([ci.deps.*]). sbt 2 does
      # not use ~/.ivy2/cache, and ~/.sbt/1.0 is sbt 1 state. The month in the key starts a new
      # entry each month, so files of old dependencies do not pile up.
      - name: Name the dependency cache
        id: deps
        run: |
          prefix="deps-${{ runner.os }}-${{ runner.arch }}-ci-jvm-${{ matrix.name }}-$(date -u +%Y-%m)-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties') }}" >> "$GITHUB_OUTPUT"
          mkdir -p ~/.cache/coursier ~/.sbt/boot
      - name: Restore the dependency cache
        id: deps-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt/boot
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.prefix }}
      # The sbt task cache of this job ([ci.task.*], [ci.jobs.shared-cache-action]).
      - name: Restore the task cache
        id: task
        uses: ./.github/actions/sbt-task-cache/restore
        with:
          job: ci-jvm-${{ matrix.name }}
      - name: Build and test in Nix devshell
        run: |
          set -o pipefail
          nix develop .#ci --accept-flake-config --command bash -c "sbt ${{ matrix.task }}" 2>&1 | tee build.log
      # The warnings of the files that this push compiled ([ci.alias.warnings-push]).
      - name: Count the compiler warnings
        id: warnings
        if: always()
        run: scripts/ci/count-warnings.sh build.log "CI-JVM ${{ matrix.name }}"
      - name: Save the dependency cache
        if: env.SAVE_CACHES == 'true' && steps.deps-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt/boot
          key: ${{ steps.deps.outputs.key }}
      - name: Delete the older dependency caches of this job
        if: env.SAVE_CACHES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/prune-caches.sh "${{ steps.deps.outputs.prefix }}" "${{ steps.deps.outputs.key }}"
      # Also after a failed test: sbt caches only passing suites, and the compile outputs still help
      # the next run.
      - name: Save the task cache
        if: ${{ !cancelled() && env.SAVE_CACHES == 'true' }}
        uses: ./.github/actions/sbt-task-cache/save
        with:
          prefix: ${{ steps.task.outputs.prefix }}
          key: ${{ steps.task.outputs.key }}
          token: ${{ github.token }}
      - name: Show what the runner cached
        if: always()
        run: du -sh ~/.cache/coursier ~/.sbt/boot ~/.cache/sbt 2>/dev/null || true
      - name: Report test results
        uses: sarisia/actions-status-discord@v1
        if: always()
        env:
          WARNINGS: ${{ steps.warnings.outputs.warnings }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "[${{ github.event.repository.name }}] CI-JVM (${{ matrix.name }}) ${{ job.status == 'success' && '✅' || '❌' }} - ${{ github.actor }} on ${{ github.ref_name }}"
          description: "[${{ github.event.head_commit.message }}](${{ github.event.head_commit.url }})${{ steps.warnings.outputs.warnings > 0 && format('\n⚠️ Warnings: {0}', steps.warnings.outputs.warnings) || '' }}"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          nodetail: true
          notimestamp: true
