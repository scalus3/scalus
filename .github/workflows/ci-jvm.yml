name: CI-JVM
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'scalus-secp256k1-jni/**'
      - '.github/workflows/**'
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Don't cancel the other Scala version's job when one fails.
      fail-fast: false
      matrix:
        include:
          # One job per supported compiler version. 3.3.8 is the default LTS and the version the
          # `_3` library artifacts are published from, so it also carries the format + MiMa checks.
          - { name: "3.3.8", task: ci-jvm-3_3_8 }
          # 3.3.7 is supported for the compiler plugin only, so its job is the cheaper canary:
          # plugin compile plus the scalus.compiler.* compile-and-evaluate suite.
          - { name: "3.3.7", task: ci-jvm-3_3_7 }
          - { name: "3.8.4", task: ci-jvm-3_8_4 }
          - { name: "3.9.0", task: ci-jvm-3_9_0 }
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - name: Build and test in Nix devshell
        id: build
        run: |
          nix develop .#ci --accept-flake-config --command bash -c "sbt ${{ matrix.task }}" 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          WARNINGS=$(grep -ci "warning:" build.log) || WARNINGS=0
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          exit $BUILD_EXIT_CODE
      - name: Report test results
        uses: sarisia/actions-status-discord@v1
        if: always()
        env:
          WARNINGS: ${{ steps.build.outputs.warnings }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "[${{ github.event.repository.name }}] CI-JVM (${{ matrix.name }}) ${{ job.status == 'success' && '✅' || '❌' }} - ${{ github.actor }} on ${{ github.ref_name }}"
          description: "[${{ github.event.head_commit.message }}](${{ github.event.head_commit.url }})${{ steps.build.outputs.warnings > 0 && format('\n⚠️ Warnings: {0}', steps.build.outputs.warnings) || '' }}"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          nodetail: true
          notimestamp: true
