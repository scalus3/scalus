name: Deploy Site

# Versioned API docs and llms files: docs/superpowers/specs/2026-10-22-versioned-api-docs-design.md
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Tags to (re)build, space-separated, e.g. "v1.3.0 v1.4.0". Empty = the newest v* tag. Other versions already on gh-pages are kept.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history and tags, needed for the version worktrees

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Java (for Scaladoc and llms-api.txt generation)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Restore version folders from gh-pages
        # Only api/<version>/ and llms/<version>/ [VW-1]. The root API is rebuilt from the latest
        # version [VW-2], so a stale page of the old unversioned layout never comes back.
        run: |
          set -euo pipefail
          if git fetch origin gh-pages; then
            PATHS=$(git ls-tree -d --name-only origin/gh-pages api/ llms/ | grep -E '^(api|llms)/[0-9]' || true)
            if [ -n "$PATHS" ]; then
              git archive origin/gh-pages $PATHS | tar -x -C scalus-site/public
              echo "Restored: $(echo $PATHS)"
            fi
          else
            echo "gh-pages branch does not exist yet"
          fi

      - name: Build the requested versions
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          set -euo pipefail
          if [ -z "$VERSIONS" ]; then
            VERSIONS=$(git describe --tags --abbrev=0 --match 'v*')
          fi
          for TAG in $VERSIONS; do
            echo "::group::$TAG"
            scalus-site/scripts/build-version.sh "$TAG"
            echo "::endgroup::"
          done

      - name: Install dependencies
        working-directory: scalus-site
        run: pnpm install --frozen-lockfile

      - name: Build site (Next.js copies public/ to out/)
        working-directory: scalus-site
        run: pnpm build

      - name: Add the root API, versions.json and the root llms files
        working-directory: scalus-site
        run: scripts/finalize-versions.sh out

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages
        # --no-history: one commit, so the branch does not grow by hundreds of MB per deploy [VW-10]
        working-directory: scalus-site
        run: |
          npx gh-pages --no-history -d out -b gh-pages -r https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git --cname scalus.org
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
