name: CI-JS
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'scalus-secp256k1-jni/**'
      - 'scalus-crypto-jni/**'
      - '.github/workflows/**'
env:
  # Only master saves caches; a branch restores the entries of master
  # (docs/superpowers/specs/2026-11-21-ci-speed-design.md, [ci.nix.save-on-master]).
  SAVE_CACHES: ${{ github.ref == 'refs/heads/master' }}
  # A fixed version, so the git version in BuildInfo does not change the sources of each commit
  # ([ci.alias.stable-version]). This job publishes nothing.
  SCALUS_STABLE_VERSION: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      # The deletion of old cache entries ([ci.prune.after-save]).
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      # The Nix store of the `ci` shell. The CI-JVM 3.3.9 job saves it ([ci.nix.one-saver]).
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-ci.${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-ci.
      # The coursier downloads and the sbt 2 launcher, one entry per job ([ci.deps.*]); see ci-jvm.yml.
      - name: Name the dependency cache
        id: deps
        run: |
          prefix="deps-${{ runner.os }}-${{ runner.arch }}-ci-js-$(date -u +%Y-%m)-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties') }}" >> "$GITHUB_OUTPUT"
          mkdir -p ~/.cache/coursier ~/.sbt/boot
      - name: Restore the dependency cache
        id: deps-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt/boot
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.prefix }}
      # The runner has 16 GB and no swap. sbt (8 GB heap, plus code cache and metaspace) and two
      # Node test processes still reach that peak at times, while sbt compiles one module and
      # links and tests another, and the runner then kills the step with exit 143 (2 of 4 master
      # runs, 2026-11-23 and 2026-11-24). With swap, such a peak makes the step slower instead.
      - name: Add swap space
        run: scripts/ci/add-swap.sh 8G
      - name: Show runner memory
        run: |
          nproc
          free -m
          swapon --show
      # The sbt task cache of this job ([ci.task.*], [ci.jobs.shared-cache-action]).
      - name: Restore the task cache
        id: task
        uses: ./.github/actions/sbt-task-cache/restore
        with:
          job: ci-js
      # The runner VM has 16 GB. js/test runs the six Scala.js test modules at once: up to four
      # linker jobs in the sbt JVM (-Xmx8g from .jvmopts) and four Node test processes
      # (--max-old-space-size=2048 each). About one run in five died there with "The runner
      # has received a shutdown signal", on ubuntu-24.04 and ubuntu-26.04 alike. Two links
      # and two test runs at a time keep the peak inside the machine. The sampler prints
      # used memory every 20 s, so a run that still dies shows how close it came.
      # sbt 2.1's default workerMaxInstances (2) caps only forked JVM test groups; Scala.js tests
      # run Node, not a forked JVM, so this Tags.Test limit is still the only cap on them.
      - name: Build and test in Nix devshell
        run: |
          (while sleep 20; do free -m | awk '/^Mem:/ {m=$3} /^Swap:/ {s=$3} END {print "[mem] used " m " MB, swap " s " MB"}'; done) &
          sampler=$!
          set -o pipefail
          nix develop .#ci --accept-flake-config --command bash -c '
            sbt "set Global / concurrentRestrictions ++= Seq(Tags.limit(Tags.Test, 2), Tags.limit(ScalaJSTags.Link, 2)); ci-js" &&
            npm --prefix scalus-cardano-ledger/js/src/main/npm run test:browser
          ' 2>&1 | tee build.log
          kill $sampler
      # The warnings of the files that this push compiled ([ci.alias.warnings-push]).
      - name: Count the compiler warnings
        if: always()
        run: scripts/ci/count-warnings.sh build.log CI-JS
      - name: Save the dependency cache
        if: env.SAVE_CACHES == 'true' && steps.deps-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt/boot
          key: ${{ steps.deps.outputs.key }}
      - name: Delete the older dependency caches of this job
        if: env.SAVE_CACHES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/prune-caches.sh "${{ steps.deps.outputs.prefix }}" "${{ steps.deps.outputs.key }}"
      # Also after a failed test: sbt caches only passing suites, and the compile outputs still help
      # the next run.
      - name: Save the task cache
        if: ${{ !cancelled() && env.SAVE_CACHES == 'true' }}
        uses: ./.github/actions/sbt-task-cache/save
        with:
          prefix: ${{ steps.task.outputs.prefix }}
          key: ${{ steps.task.outputs.key }}
          token: ${{ github.token }}
      - name: Show what the runner cached
        if: always()
        run: du -sh ~/.cache/coursier ~/.sbt/boot ~/.cache/sbt 2>/dev/null || true
      - name: Report test results
        uses: sarisia/actions-status-discord@v1
        if: failure()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "CI-JS ❌ - ${{ github.actor }} on ${{ github.ref_name }}"
          description: "[${{ github.event.head_commit.message }}](${{ github.event.head_commit.url }})"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          nodetail: true
          notimestamp: true